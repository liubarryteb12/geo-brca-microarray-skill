name: GEO breast cancer microarray analysis

# 手动触发，或推送到 main 时自动运行
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/geo_analysis.yml'

permissions:
  contents: read

jobs:
  analysis:
    name: R/Bioconductor pipeline (GSE92252)
    runs-on: ubuntu-latest
    # spec 要求：单次运行不超过 20 分钟
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 芯片注释包与 STRINGdb 需要这些系统库才能编译
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      # pak 通过 Posit Package Manager 拉 Linux 二进制包，避免源码编译
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GEOquery
            any::limma
            any::clusterProfiler
            any::org.Hs.eg.db
            any::enrichplot
            any::STRINGdb
            any::pheatmap
            any::ggplot2
            any::impute
            any::dplyr
            any::tibble
            any::igraph
            any::jsonlite
            any::yaml
            any::ggrepel
            any::statmod
          cache-version: 1

      - name: Run analysis pipeline
        run: Rscript scripts/main_analysis.R --config assets/config.yml

      # always() 保证即使分析失败也能拿到中间产物用于排查
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-results
          path: |
            results/
            data/group.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise run
        if: always()
        run: |
          echo "### GEO pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/state.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/state.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_no state.json produced_" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          ls -la results/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
