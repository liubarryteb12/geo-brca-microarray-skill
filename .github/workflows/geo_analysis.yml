name: GEO breast cancer microarray analysis

# 手动触发（可指定数据集），或推送到 main 时自动运行（两个数据集都跑）
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: '要跑的数据集（对应 assets/config.<dataset>.yml）'
        required: true
        default: 'GSE42568'
        type: choice
        options:
          - GSE42568
          - GSE64790
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/geo_analysis.yml'

permissions:
  contents: read

jobs:
  analysis:
    # 一个数据集一个 job，产物各落在 results/<GSE>/ 下，互不覆盖。
    # 手动触发时只跑指定的那一个；push 时两个都跑，保证两条路径都还在绿。
    name: R/Bioconductor pipeline (${{ matrix.dataset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.dataset)) || fromJSON('["GSE64790","GSE42568"]') }}
    # spec 要求单次运行 < 20 分钟。**实测（run 35438543496，bioc-v3）**：
    #
    #                     Install R packages   Run analysis   job 总计
    #   GSE64790                66s              244s          6m10s
    #   GSE42568                66s              400s          8m49s
    #
    # 但那次的 Install 只有 66s —— 因为 bioc-v3 是新键，`restore-keys: rlib-Linux-`
    # 命中了 bioc-v2 的缓存，只做了增量安装。**全冷缓存下装包实测约 720s**，
    # 整轮会到 20 分钟左右，正好压在 spec 上限上。
    #
    # 所以超时写 30 分钟，而不是 20：被掐死的 job 存不下缓存，
    # 下一轮又是冷缓存，会变成"每次都超时"的死循环 —— 多留 10 分钟比这个便宜。
    # 走的是暖缓存时整轮 9 分钟内结束，这个上限平时用不到。
    timeout-minutes: 30

    # **把 BLAS 线程数钉死为 1，否则数值结果不是逐位可复现的。**
    #
    # 实测两轮 CI 的 deg_table.csv 在浮点末位分叉：
    #   A: P.Value=6.00193941779545e-05   adj.P.Val=0.394010725208314
    #   B: P.Value=6.00193941779546e-05   adj.P.Val=0.394010725208312
    # t 统计量在 15 位有效数字上看着一样，但残差平方和走的是多线程 BLAS 归约，
    # 线程调度不同 -> 累加顺序不同 -> 末位不同 -> 极小的 P 值把这个差异放大到可见。
    #
    # 这跟前面四个随机源（impute.knn / fgsea / igraph 布局 / ggrepel）不是一类问题：
    # 那些是"没设种子"，这个是"设了种子也没用"，只有限制并行度才能消除。
    # 之前几轮 CI 报"逐字节一致"其实是运气 —— 线程调度恰好相同。
    env:
      # 把浮点结果钉死。**这四个是两组不同的问题，缺一组都不够：**
      #
      # 1) 线程数：多线程归约的求和顺序取决于线程调度，每次运行都不同。
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # 2) 内核选择：OpenBLAS 在**运行期**按检测到的 CPU 型号分发 SIMD 内核
      #    （SSE/AVX2/AVX512 的向量宽度不同 → 归约顺序不同 → 末位不同）。
      #    这一层线程数管不到。实测同一 commit、同一 Azure 区域（westus3）
      #    的两轮给出不同的末位，差约 1 个 ULP（deg_table 最大 9.9e-14，
      #    pca_ellipse 最大 1.0e-12），而 data/ 输入文件逐字节一致 ——
      #    GitHub 托管 runner 的 CPU 型号在同一区域内也不单一。
      #    钉住内核类型后，选哪条 SIMD 路径不再取决于宿主 CPU。
      OPENBLAS_CORETYPE: Haswell
      DATASET: ${{ matrix.dataset }}
      CONFIG: assets/config.${{ matrix.dataset }}.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 编译 Bioc 源码包与 STRINGdb 需要这些系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      # 注意：这里刻意不用 spec 里写的 r-version 4.3.0。
      # P3M 的 Linux 二进制包是按当前 R 构建的，ubuntu-latest 现在是 noble(24.04)，
      # R 4.3 + noble + 二进制根本对不上，会被迫全量源码编译；
      # 而 P3M 的 Bioconductor 镜像又已下线 3.18（见 EXPERIMENTAL_DESIGN.md §2.6）。
      # 用 release 才能让 CRAN 依赖走二进制，把时间压下来。
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # setup-r-dependencies 自己的缓存对本仓库不生效（无 DESCRIPTION/lockfile，
      # post 步骤 0s 直接跳过），所以显式缓存 R 库。
      # key 用固定的 bioc-vN 而不是 workflow 文件哈希：否则每次改 workflow
      # （哪怕只改超时或注释）都会让 12 分钟的源码编译重来一遍。
      # **改动下面的 packages 列表时，必须把 bioc-vN 手动递增。**
      # 为什么必须递增：actions/cache 的 key 一旦存在就不会再写回，
      # 沿用旧 key 的话新装的包每次运行都会被丢掉、重新装一遍。
      # v1 -> v2：加入 fgsea（preranked GSEA 的引擎）。
      # v2 -> v3：加入 WGCNA（共表达网络）、glmnet + survival（LASSO-Cox 与
      #          KM 曲线）、matrixStats（WGCNA 的依赖，显式列出以免被间接装成旧版）。
      # v3 -> v4：加入 dorothea（TF 调控子，08_tf_regulation.R 的主来源）。
      # v4 -> v5：加入 timeROC / rms（§1.6 时间依赖 AUC 与校准，
      #          10_survival_diagnostics.R）。**改 packages 必须递增这个键** ——
      #          actions/cache 的 key 一旦存在就不再写回，沿用旧 key 会让
      #          新装的包每次运行都被丢掉、重新装一遍。
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-bioc-v5
          restore-keys: |
            rlib-${{ runner.os }}-

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GEOquery
            any::limma
            any::clusterProfiler
            any::fgsea
            any::org.Hs.eg.db
            any::enrichplot
            any::STRINGdb
            any::pheatmap
            any::ggplot2
            any::impute
            any::igraph
            any::jsonlite
            any::yaml
            any::ggrepel
            any::statmod
            any::WGCNA
            any::glmnet
            any::survival
            any::matrixStats
            any::dorothea
            any::timeROC
            any::rms
          cache-version: 1

      # 纯诊断步骤，不允许它拖垮整条流水线
      - name: Record environment
        continue-on-error: true
        run: |
          Rscript -e 'cat(R.version.string, "\n"); if (requireNamespace("BiocVersion", quietly=TRUE)) cat("Bioconductor:", as.character(BiocVersion::version()), "\n"); cat("lib:", .libPaths()[1], "\n")'
          Rscript -e 'for (p in c("GEOquery","limma","clusterProfiler","org.Hs.eg.db","enrichplot","STRINGdb","pheatmap","impute","igraph","yaml","ggrepel","statmod","WGCNA","glmnet","survival","matrixStats","dorothea")) cat(sprintf("%-16s %s\n", p, if (requireNamespace(p, quietly=TRUE)) as.character(packageVersion(p)) else "MISSING"))'

      # 数据集预检：物种 / 数据类型 / 样本量 / 分组。
      # 00_validate_inputs.R 内部还会再判一次，这里只是让失败发生在**装包之前**。
      #
      # **预检必须用这个数据集真正在跑的那套门禁。** 原来不传 --design-mode，
      # 于是默认落到 small_sample —— GSE42568（n=121，config 里是 cohort）
      # 每次都打印
      #   GSE42568  FAIL  (design_mode: small_sample)
      #     FAIL  样本量不合规: 121（small_sample 要求 >= 1 且 < 10）
      # 而同一个数据集在 cohort 下跑得好好的（同一份日志里就有
      # "样本量 OK: 121 (>= 15, design_mode=cohort)"）。
      #
      # **一个与真实门禁矛盾的 FAIL 比没有预检更糟** —— 读者会以为这个数据集
      # 不合规，或者以为预检坏了。两套门禁由 design_mode 选择，
      # 不是一个门禁换个阈值（AGENTS.md 规则 1）。
      #
      # 保留 `|| true`（只报告、不拦）是有意的：真正的硬门禁在
      # 00_validate_inputs.R 里，而这一步要访问 GEO 接口 —— 让网络抖动
      # 变成 job 失败，会把"每次推送 CI 必须绿"这条约束稀释掉。
      - name: Pre-flight the dataset
        run: |
          MODE=$(node -e 'const s=require("fs").readFileSync(process.argv[1],"utf8");const m=s.match(/^design_mode:\s*(\S+)/m);process.stdout.write(m?m[1]:"small_sample")' "$CONFIG")
          echo "预检 design_mode=$MODE（读自 $CONFIG）"
          node scripts/find_dataset.mjs check "$DATASET" --design-mode "$MODE" || true

      # 临床终点是**选数据集时**要看的，不是每次运行的硬门禁：
      # 没有随访的数据集照样能跑完整条流程，只是做不了预后模型。
      # 所以这里只报告，不拦。见 tools/check_clinical_endpoints.mjs 头部注释。
      - name: Report clinical endpoints (informational)
        continue-on-error: true
        run: node tools/check_clinical_endpoints.mjs "$DATASET"

      - name: Run analysis pipeline
        run: Rscript scripts/main_analysis.R --config "$CONFIG"

      # 静态检查不依赖 R，可以在装包之前就拦下来，但放在这里是为了让
      # "分析跑通了" 与 "代码/配色合格" 在同一段日志里能对照着看。
      - name: Check R syntax and structure
        run: node tools/check_r_syntax.mjs

      # "一个颜色一个含义"是条不变量，但没有东西守着它。
      # 实测本仓库曾经同时存在三种红（其中 firebrick 与 up 红只差 0.4°）、
      # 一套在 protanopia 下 up 红与分类棕距离 0.002 的色板。
      # 这些凭眼睛看不出来，只能算。所以把判据固化成门禁。
      - name: Check the palette is still one-colour-one-meaning
        run: node tools/check_palette.mjs

      # 验收查的是 **runner 的工作目录**，artifact 的 path 是**另一份清单**。
      # 两者不一致时验收全绿而下载到的产物缺文件 —— 实测踩过：
      # batch_assessment.json 验收 PASS 但没进 artifact，另外还漏了
      # expr_clean.csv（清洗后的表达矩阵）和 meta.csv，一直没被发现。
      # 这个检查把两份清单交叉核对，是纯静态的、不需要 R。
      - name: Check data/ outputs are all in the artifact list
        run: node tools/check_artifact_paths.mjs

      # 验收只判断文件**存在**，不判断图**有没有画出来**。
      # 出图代码有一类静默失败：设备开了、绘图没执行、设备关了 —— 文件在、大小正常、
      # 就是白图（本仓库真踩过：save_pdf 里 force(expr) 两次只跑一遍绘图代码）。
      # 所以独立解码 PNG 像素再判一次。不加 if: always()，它是**分析产出的门禁**，
      # 只在该有产出的时候才该发声；分析本身失败时另有那一步的红灯。
      - name: Verify figures are not blank
        run: node tools/check_figures.mjs "results/$DATASET"

      # **给图加带版本号的副本。**
      #
      # 规范文件名（`PPI_network.png`）必须保留 —— `check_acceptance()`、README
      # 的输出清单、以及任何下游脚本都按它找文件。
      #
      # 但同名文件在不同 commit 上内容不同，**光看名字分不出手上这份是哪个版本**。
      # 实测就是这么把两轮 CI 的图当成同一张的：本地的图和刚产出的图都叫
      # `PPI_network.png`，谁也说不清看的是哪一份。
      #
      # 所以额外写一份 `<名字>__<短SHA>.png`。SHA 取自 `github.sha`，
      # **同一个 commit 上稳定**，所以不影响"连跑两轮逐字节一致"这个保证 ——
      # 两轮的副本名字和内容都相同。
      #
      # 用命名区分，不改图片内容：图要保持发表级干净。
      - name: Write versioned copies of the figures
        if: always()
        run: |
          short="${GITHUB_SHA:0:7}"
          shopt -s nullglob
          n=0
          for f in results/"$DATASET"/*.png results/"$DATASET"/*.pdf; do
            base="${f%.*}"
            ext="${f##*.}"
            cp "$f" "${base}__${short}.${ext}"
            n=$((n + 1))
          done
          echo "已写出 $n 份带版本号的副本（后缀 $short）"
          ls -1 results/"$DATASET"/*__*.png 2>/dev/null | head -20 || true

      # always() 保证即使分析失败也能拿到中间产物用于排查
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带数据集：两个 job 的产物不再混在一起，
          # 下载下来就是 geo-results-GSE42568/ 这样一个明确的目录。
          #
          # **这里必须逐个列举 data/ 的文件。**
          # 实测踩过：batch_assessment.json 写出来了、验收也 PASS（文件在
          # runner 上确实存在），但**没进 artifact** —— 于是用户下载到的
          # 产物里缺这份记录，而验收日志说它通过了。
          # 验收查的是 runner 的工作目录，artifact 是另一份路径清单，
          # 两者不一致时**只有下载下来才会发现**。
          #
          # 用 `node tools/check_artifact_paths.mjs` 交叉核对这两份清单。
          # 它当初一次就找出 6 个漏掉的文件，包括 expr_clean.csv
          # （清洗后的表达矩阵 —— 核心交付物）和 meta.csv。
          name: geo-results-${{ matrix.dataset }}
          path: |
            results/${{ matrix.dataset }}/
            data/${{ matrix.dataset }}/group.csv
            data/${{ matrix.dataset }}/meta.csv
            data/${{ matrix.dataset }}/platform.txt
            data/${{ matrix.dataset }}/clean_stats.json
            data/${{ matrix.dataset }}/feature_mode.json
            data/${{ matrix.dataset }}/geo_metadata.json
            data/${{ matrix.dataset }}/clinical.csv
            data/${{ matrix.dataset }}/clinical_fields.json
            data/${{ matrix.dataset }}/batch_assessment.json
            data/${{ matrix.dataset }}/expr_clean.csv
            data/${{ matrix.dataset }}/expr_clean.rds
            data/${{ matrix.dataset }}/expr_raw.rds
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise run
        if: always()
        run: |
          echo "### GEO pipeline summary — $DATASET" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "results/$DATASET/state.json" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "results/$DATASET/state.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_no state.json produced_" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          ls -la "results/$DATASET/" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
