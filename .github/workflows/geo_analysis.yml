name: GEO breast cancer microarray analysis

# 手动触发，或推送到 main 时自动运行
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/geo_analysis.yml'

permissions:
  contents: read

jobs:
  analysis:
    name: R/Bioconductor pipeline (GSE92252)
    runs-on: ubuntu-latest
    # spec 要求单次运行 < 20 分钟。实测冷缓存整轮 14m58s（run 35409119340），
    # 其中 Install R packages 722s、分析流水线 115s，20 分钟够用。
    # 之所以不写更紧的值：冷缓存下装包要 12 分钟，留给分析只有 8 分钟，
    # 超时被掐死的 job 往往存不下缓存，会变成"每次都超时"的死循环。
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 编译 Bioc 源码包与 STRINGdb 需要这些系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      # 注意：这里刻意不用 spec 里写的 r-version 4.3.0。
      # P3M 的 Linux 二进制包是按当前 R 构建的，ubuntu-latest 现在是 noble(24.04)，
      # R 4.3 + noble + 二进制根本对不上，会被迫全量源码编译；
      # 而 P3M 的 Bioconductor 镜像又已下线 3.18（见 EXPERIMENTAL_DESIGN.md §2.6）。
      # 用 release 才能让 CRAN 依赖走二进制，把时间压下来。
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # setup-r-dependencies 自己的缓存对本仓库不生效（无 DESCRIPTION/lockfile，
      # post 步骤 0s 直接跳过），所以显式缓存 R 库。
      # key 用固定的 bioc-vN 而不是 workflow 文件哈希：否则每次改 workflow
      # （哪怕只改超时或注释）都会让 12 分钟的源码编译重来一遍。
      # **改动下面的 packages 列表时，必须把 bioc-vN 手动递增。**
      # 为什么必须递增：actions/cache 的 key 一旦存在就不会再写回，
      # 沿用旧 key 的话新装的包每次运行都会被丢掉、重新装一遍。
      # v1 -> v2：加入 fgsea（preranked GSEA 的引擎）。
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-bioc-v2
          restore-keys: |
            rlib-${{ runner.os }}-

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GEOquery
            any::limma
            any::clusterProfiler
            any::fgsea
            any::org.Hs.eg.db
            any::enrichplot
            any::STRINGdb
            any::pheatmap
            any::ggplot2
            any::impute
            any::igraph
            any::jsonlite
            any::yaml
            any::ggrepel
            any::statmod
          cache-version: 1

      # 纯诊断步骤，不允许它拖垮整条流水线
      - name: Record environment
        continue-on-error: true
        run: |
          Rscript -e 'cat(R.version.string, "\n"); if (requireNamespace("BiocVersion", quietly=TRUE)) cat("Bioconductor:", as.character(BiocVersion::version()), "\n"); cat("lib:", .libPaths()[1], "\n")'
          Rscript -e 'for (p in c("GEOquery","limma","clusterProfiler","org.Hs.eg.db","enrichplot","STRINGdb","pheatmap","impute","igraph","yaml","ggrepel","statmod")) cat(sprintf("%-16s %s\n", p, if (requireNamespace(p, quietly=TRUE)) as.character(packageVersion(p)) else "MISSING"))'

      - name: Run analysis pipeline
        run: Rscript scripts/main_analysis.R --config assets/config.yml

      # 验收只判断文件**存在**，不判断图**有没有画出来**。
      # 出图代码有一类静默失败：设备开了、绘图没执行、设备关了 —— 文件在、大小正常、
      # 就是白图（本仓库真踩过：save_pdf 里 force(expr) 两次只跑一遍绘图代码）。
      # 所以独立解码 PNG 像素再判一次。不加 if: always()，它是**分析产出的门禁**，
      # 只在该有产出的时候才该发声；分析本身失败时另有那一步的红灯。
      - name: Verify figures are not blank
        run: node tools/check_figures.mjs results

      # always() 保证即使分析失败也能拿到中间产物用于排查
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-results
          path: |
            results/
            data/group.csv
            data/clean_stats.json
            data/feature_mode.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise run
        if: always()
        run: |
          echo "### GEO pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/state.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/state.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_no state.json produced_" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          ls -la results/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
