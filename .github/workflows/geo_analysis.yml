name: GEO breast cancer microarray analysis

# 手动触发，或推送到 main 时自动运行
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/geo_analysis.yml'

permissions:
  contents: read

jobs:
  analysis:
    name: R/Bioconductor pipeline (GSE92252)
    runs-on: ubuntu-latest
    # 首次（冷缓存）运行要现场编译 Bioconductor 源码包，实测 Install R packages
    # 单独就要 730s；分析本身还要几分钟。20 分钟在冷缓存下不够，会把 job 掐死，
    # 而 job 被掐死时缓存往往存不下来 —— 于是下一次仍然是冷缓存，形成死循环。
    # 所以这里放宽到 30 分钟，并显式缓存 R 库让后续运行回到 20 分钟以内。
    # 实测数据见 EXPERIMENTAL_DESIGN.md §2.7。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 编译 Bioc 源码包与 STRINGdb 需要这些系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev

      # 注意：这里刻意不用 spec 里写的 r-version 4.3.0。
      # P3M 的 Linux 二进制包是按当前 R 构建的，ubuntu-latest 现在是 noble(24.04)，
      # R 4.3 + noble + 二进制根本对不上，会被迫全量源码编译；
      # 而 P3M 的 Bioconductor 镜像又已下线 3.18（见 EXPERIMENTAL_DESIGN.md §2.6）。
      # 用 release 才能让 CRAN 依赖走二进制，把时间压下来。
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # setup-r-dependencies 自己的缓存对本仓库不生效（无 DESCRIPTION/lockfile，
      # post 步骤 0s 直接跳过），所以显式缓存 R 库。key 里带 workflow 文件哈希，
      # 改了包列表就会自动重建。
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: rlib-${{ runner.os }}-${{ hashFiles('.github/workflows/geo_analysis.yml') }}
          restore-keys: |
            rlib-${{ runner.os }}-

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GEOquery
            any::limma
            any::clusterProfiler
            any::org.Hs.eg.db
            any::enrichplot
            any::STRINGdb
            any::pheatmap
            any::ggplot2
            any::impute
            any::igraph
            any::jsonlite
            any::yaml
            any::ggrepel
            any::statmod
          cache-version: 1

      # 纯诊断步骤，不允许它拖垮整条流水线
      - name: Record environment
        continue-on-error: true
        run: |
          Rscript -e 'cat(R.version.string, "\n"); if (requireNamespace("BiocVersion", quietly=TRUE)) cat("Bioconductor:", as.character(BiocVersion::version()), "\n"); cat("lib:", .libPaths()[1], "\n")'
          Rscript -e 'for (p in c("GEOquery","limma","clusterProfiler","org.Hs.eg.db","enrichplot","STRINGdb","pheatmap","impute","igraph","yaml","ggrepel","statmod")) cat(sprintf("%-16s %s\n", p, if (requireNamespace(p, quietly=TRUE)) as.character(packageVersion(p)) else "MISSING"))'

      - name: Run analysis pipeline
        run: Rscript scripts/main_analysis.R --config assets/config.yml

      # always() 保证即使分析失败也能拿到中间产物用于排查
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-results
          path: |
            results/
            data/group.csv
            data/clean_stats.json
            data/feature_mode.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarise run
        if: always()
        run: |
          echo "### GEO pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/state.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat results/state.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_no state.json produced_" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts:" >> "$GITHUB_STEP_SUMMARY"
          ls -la results/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
