# ============================================================================
# GEO 乳腺癌芯片数据挖掘 — 分析配置（GSE42568，队列级）
# ============================================================================
# 一个数据集一个配置文件。产物落在 results/GSE42568/ 与 data/GSE42568/。
#
# 本文件是 GSE64790 的**放大版**：同一个对比（tumor vs normal）、同一个物种、
# 同样是芯片，只是样本量从 6 变成 121。用途是把 GSE64790 上"信号存在但功效不足"
# 的假设，放到有功效的队列上验证。
# ============================================================================

# ---- 设计模式 --------------------------------------------------------------
# 121 个样本，远超 small_sample 的上限 10，必须用 cohort。
# 门禁要求：总样本 >= 15（WGCNA 通行下限），每组 >= 10。
design_mode: cohort

# ---- 数据源 ----------------------------------------------------------------
# GSE42568: 人源乳腺癌 Affymetrix HG-U133 Plus 2.0 芯片，121 例
#           （104 例癌 + 17 例正常乳腺），GPL570。PubMed 23740839。
#
# 实测的完整 characteristics（`node tools/check_clinical_endpoints.mjs GSE42568`）：
#   tissue                        breast cancer×104  normal breast×17
#   overall survival event        0×69   1×35   NA×17     <- 35 个死亡事件
#   overall survival time_days    103 种取值
#   relapse free survival event   0×56   1×48   NA×17     <- 48 个复发事件
#   relapse free survival time    100 种取值
#   er_status / grade / lymph node status / age / size
#
# **17 例正常样本的全部临床字段都是 NA**，这是分组后做临床分析时要过滤掉的。
dataset_id: GSE42568
platform_id: GPL570            # 可留空，由 GEOquery 自动识别

# ---- 分组 ------------------------------------------------------------------
# characteristics_ch1 的实际取值（实测）：
#   癌:   "tissue: breast cancer"
#   正常: "tissue: normal breast"
#
# 匹配的是**全部 characteristics 拼起来的字符串**，所以模式要能唯一定位。
# 这里用短模式即可：其余字段（age / er_status / grade / 淋巴结 / 生存）
# 的取值里都不含 "breast cancer" 或 "normal breast"。
# 若将来报「分组歧义」，说明有新字段撞上了，那时再收紧成 "tissue: breast cancer"。
group_field: characteristics_ch1

group_values:
  tumor:  ["breast cancer"]
  normal: ["normal breast"]

contrast: ["tumor", "normal"]

# ---- 配对 ------------------------------------------------------------------
# **不配对。** 17 例正常样本与 104 例癌不是同一批患者，而且正常样本的
# 全部临床字段（年龄、分期、生存）都是 NA —— 没有任何可用于配对的依据。
# 按规则 4，配对关系必须显式声明且拿得出依据，不能靠猜。
paired: false

# ---- 阈值 ------------------------------------------------------------------
thresholds:
  adj_p: 0.05
  # 队列级数据用通行的 2 倍差异阈值。
  #
  # **这和 GSE64790 的 0.5 不是"同一个参数取不同值"，而是不同的判据。**
  # GSE64790 把阈值降到 0.5 是为了让火山图上的名义显著层有意义（那里
  # 最小 adj.P = 0.394，全基因组 BH 校正下没有任何基因能通过）；
  # 这里 n=121，功效足够，没有理由放宽倍数要求。
  log2fc: 1.0
  string_score: 400
  outlier_cor: 0.8

# ---- 分析选项 --------------------------------------------------------------
analysis:
  seed: 20260919               # 不可删，理由见 config.GSE64790.yml
  top_heatmap_genes: 50
  impute_k: 10
  pca_top_genes: 2000
  hub_gene_count: 10
  ppi_plot_max_nodes: 200
  ppi_plot_max_edges: 450
  ppi_plot_rings: 3
  ppi_plot_modules: 4
  # 降级路径。队列级数据**正常情况下不应该走到这里** ——
  # 如果 enrichment_status.json 出现 deg_mode=ranked_fallback，
  # 说明 DEG 结果异常（而不只是功效不足），要先查 pvalue_histogram。
  ranked_fallback_genes: 500
  gsea_min_set: 15
  gsea_max_set: 500

enrichment:
  universe: detected
  p_adjust: BH
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.2
  top_terms: 15
  ont: BP
  kegg_organism: hsa
  redundancy_jaccard: 0.5

# ---- 输出 ------------------------------------------------------------------
# 留空即由 dataset_id 派生为 results/GSE42568 与 data/GSE42568。
output: {}
