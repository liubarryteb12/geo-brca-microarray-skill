# ============================================================================
# GEO 乳腺癌小样本芯片数据挖掘 — 分析配置
# ============================================================================
# 修改本文件即可切换数据集 / 分组 / 阈值，无需改任何 R 代码。
# 所有字段都会被 scripts/00_validate_inputs.R 校验，缺失或矛盾直接退出。
# ============================================================================

# ---- 数据源 ----------------------------------------------------------------
# GSE64790: 人源三阴性乳腺癌（TNBC）Agilent lncRNA 芯片，6 例（3 肿瘤 + 3 配对正常），GPL19612
#
# 为什么选它：需要「人源 + 乳腺癌 + 芯片 + 样本 < 10 + 两组」的数据集，
# 而更关键的是**分组不能被批次效应混杂**。候选逐个实测后：
#   GSE92252  3 个组恰好是 3 个批次，簇间 r 低到 0.11 → DEG 不可解释，淘汰
#   GSE112848 平台 GPL16956 是 Arraystar lncRNA V3，只有 5 列且**没有任何基因注释** → 无法富集，淘汰
#   GSE73613  只有 2 例/组，达不到每组 >= 3 的硬门禁 → 淘汰
# GSE64790 全部 6 个样本两两 r = 0.914–0.967，只有一个相关簇，无混杂。
# 详见 EXPERIMENTAL_DESIGN.md §2.10
dataset_id: GSE64790
platform_id: GPL19612          # 可留空，由 GEOquery 自动识别

# ---- 分组 ------------------------------------------------------------------
# characteristics_ch1 的实际取值（实测）：
#   肿瘤: "tissue: TNBC  tissue"  /  "gender: Female"  /  "age: 72y"
#   正常: "tissue: matched normal breast tissues"  /  "gender: Female"  /  "age: 72y"
group_field: characteristics_ch1

# 每个样本按「小写子串」匹配；命中多个组会直接报错退出，避免静默错分
group_values:
  tumor:  ["tnbc"]
  normal: ["matched normal"]

# 对比方向：[分子, 分母]。log2FC > 0 表示在 tumor 中上调
contrast: ["tumor", "normal"]

# ---- 配对 ------------------------------------------------------------------
# 该数据集是「同一患者的肿瘤 + 正常组织」配对设计：3 个患者的年龄一一对应
# （72y/72y、41y/41y、52y/52y）。患者间差异往往比肿瘤/正常差异还大，
# 不阻断就会把信号埋进残差，所以这里做配对分析。
#
# 配对关系**显式声明**，不从样本标题猜后缀 —— 猜错了不会报错，
# 只会让配对分析静默变错。00 步会校验：每个 GSM 只出现一次、
# 每对必须一例 tumor 一例 normal、不允许有样本落单。
# 03 步若发现配对设计不可用（秩不足等）会自动退回非配对并记录原因。
paired: true
pairs:
  - ["GSM1580581", "GSM1580584"]   # 72y
  - ["GSM1580582", "GSM1580585"]   # 41y
  - ["GSM1580583", "GSM1580586"]   # 52y

# ---- 阈值 ------------------------------------------------------------------
thresholds:
  adj_p: 0.05                  # BH 校正后 p 值
  # |log2FC| 阈值。0.5 = 1.41 倍表达差异。
  #
  # **注意：调这个值不会让火山图出现"显著"基因。** 判据是
  # `adj.P < 0.05` **且** `|log2FC| > log2fc`，是 AND 关系。
  # GSE64790 的最小 adj.P 是 0.394，全基因组 BH 校正下**没有任何基因**能通过
  # adj_p 这一关，所以把 log2fc 从 1.0 降到 0.5 只会让集合更小（仍是 0 个）。
  # 真正的限制在样本量（n=6），不在倍数阈值，见设计文档 §2.2。
  #
  # 火山图因此额外画一条**名义显著**层级（raw P < 0.05 且 |log2FC| > 此阈值），
  # 用独立的橙色标注为"未过 FDR，仅供探索"，避免图形空无一物，
  # 同时不把名义显著冒充成显著。
  log2fc: 0.5
  string_score: 400            # STRING PPI 置信度
  outlier_cor: 0.8             # 样本相关性低于此值标记为离群

# ---- 分析选项 --------------------------------------------------------------
analysis:
  # 全局随机种子。**不要删。** KNN 填补（impute.knn）内部用 sample() 处理并列近邻，
  # 不固定种子时每次运行的插补值都不同，下游 t 统计量 / GSEA 排序 / 富集 p 值
  # 全部跟着变。实测未设种子时两轮 CI 的 GSEA 显著条目数是 1059 和 1110 ——
  # 看起来像随机波动，实际是结果不可复现。
  seed: 20260919
  top_heatmap_genes: 50        # 热图取 top N 个 DEG；不足时自动降级
  impute_k: 10                 # KNN 填补的 k
  pca_top_genes: 2000          # PCA 使用方差最大的 N 个基因（0 = 全部）
  hub_gene_count: 10           # PPI hub 基因数量
  # PPI 网络图最多画多少个节点。**只影响图，不影响数据** ——
  # ppi_edges.csv / hub_genes.csv 始终是完整网络。
  # 390 节点 / 3284 边全画出来是一团毛线，读者看不出任何结构；
  # 图里取最大连通分量 + degree 前 N 个，并 Louvain 社区着色。
  ppi_plot_max_nodes: 200
  # 无基因通过 FDR 时，富集/PPI 退回「raw P 排序前 N 个（仍要求 |log2FC| > 阈值）」。
  # 样本数 < 10 时全基因组 BH 校正几乎不可能有基因通过，这是样本量的固有限制。
  # 降级会被写进 enrichment_status.json / ppi_status.json 的 deg_mode=ranked_fallback，
  # 结论中不得把它当成显著差异基因。设为 0 可关闭降级（富集/PPI 直接跳过）。
  ranked_fallback_genes: 500

  # ---- preranked GSEA ------------------------------------------------------
  # **这是弱功效数据集的主力富集方法。** K-Dense `pathway-enrichment` skill：
  #   "a discrete hit list → ORA; a ranked table with per-gene scores → GSEA"
  #   "Never threshold a list and then feed it to GSEA"
  #   "Better when effects are broad/subtle or when a hit list would be very
  #    short or very long"（> 2000 个基因的 ORA 列表会失去特异性）
  # 所以 GSEA 用**完整的 16,487 基因排序表**，不卡任何阈值；
  # 排序指标用 limma 的 moderated t 统计量（比 log2FC 稳定，
  # 低表达基因的 logFC 噪声很大）。
  gsea_min_set: 15             # 丢弃过小的基因集（少量基因就能显著）
  gsea_max_set: 500            # 丢弃过大的泛化基因集（"metabolic process" 这类）
  # 注意：GSEA 的随机性由上面的 analysis.seed 统一控制。
  # 曾经在这里单独放过 gsea_seed 并传给 gseGO(seed=)，实测**不足以保证复现**
  # （参数被接受但没转发到 fgsea 的采样器），所以改成调用前直接 set.seed()。

enrichment:
  # genome   = 全基因组背景（OrgDb 默认）
  # detected = 仅用芯片实测基因作背景
  #
  # **默认用 detected。** spec 里写的是"全基因组背景"，但 K-Dense 的
  # `pathway-enrichment` skill 明确指出：背景应该是"本实验**可能**检出的基因"，
  # 用过大的背景会让管家类条目假显著，这是 ORA 结果误导人最常见的方式。
  # 实测两者结果确实不同（见 EXPERIMENTAL_DESIGN.md §2.11）。
  # 需要按 spec 口径复现时把这里改回 genome 即可。
  universe: detected
  p_adjust: BH
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.2
  top_terms: 15                # dotplot 展示条目数
  ont: BP                      # GO 本体：BP / MF / CC
  kegg_organism: hsa
  # GO 条目去冗余：GO 会返回大量近义条目（"mitotic cell cycle" 的几十个变体）。
  # 按基因重叠 Jaccard 做单链接聚类，每组只保留 adj.P 最小的那个作代表。
  # 设为 1 可关闭去冗余。
  redundancy_jaccard: 0.5

# ---- 输出 ------------------------------------------------------------------
output:
  results_dir: results
  data_dir: data
